<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FastAPI — демо-сайт{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f6f8fa; }
        .error-code { font-size: 6rem; font-weight: 700; line-height: 1; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">🚀 FastAPI Демо</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">Главная</a>
            {% if user %}
                <a class="nav-link {% if request.url.path == '/profile' %}active{% endif %}" href="/profile">Домашняя</a>
                <a class="nav-link" href="/logout">Выйти ({{ user.username }})</a>
            {% else %}
                <a class="nav-link {% if request.url.path == '/login' %}active{% endif %}" href="/login">Вход</a>
                <a class="nav-link {% if request.url.path == '/register' %}active{% endif %}" href="/register">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container">
    {% block content %}{% endblock %}
</main>
</body>
</html>
