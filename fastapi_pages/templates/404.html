{% extends "base.html" %}

{% block title %}404 — страница не найдена{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="error-code text-danger">404</div>
    <h1 class="h3 mt-3">Страница не найдена</h1>
    <p class="text-muted">
        Запрошенный адрес <code>{{ url }}</code> не существует или был удалён.
    </p>
    <p class="text-muted small">Проверьте адрес или вернитесь на главную.</p>
    <a href="/" class="btn btn-primary">На главную</a>
</div>
{% endblock %}
